name: Rare Friends Genesis Sale Check

on:
  push:
    branches: [main]
    paths:
      - mint-bot.mjs
      - package.json
      - .github/workflows/rare-friends-check.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Read Rare Friends public-sale state
        run: node mint-bot.mjs --check
